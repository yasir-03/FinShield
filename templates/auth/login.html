{% extends "base.html" %}
{% block title %}Login — FinShield AI{% endblock %}
{% block body_class %}fs-auth-page{% endblock %}

{% block content %}
<section class="fs-auth-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-xl-4">
                <div class="fs-auth-card">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock fs-auth-icon"></i>
                        <h2 class="mt-3">Welcome back</h2>
                        <p class="text-muted">Log in to continue your progress.</p>
                    </div>
                    <form method="POST" action="{{ url_for('main.login') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control fs-input" required value="{{ form_data.get('email', '') }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control fs-input" required>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-fs-primary w-100 btn-lg">Log In</button>
                    </form>
                    <p class="text-center mt-4 mb-0">Don't have an account? <a href="{{ url_for('main.register') }}" class="fs-link">Sign up</a></p>
                    <div class="fs-demo-hint mt-4">
                        <i class="bi bi-info-circle"></i> Admin demo: <code>admin@finshield.ai</code> / <code>Admin@123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
